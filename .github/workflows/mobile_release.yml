name: Mobile Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

env:
  MOBILE_APK_URL: https://miramind.io/downloads/mira-latest.apk
  MOBILE_MANIFEST_URL: https://miramind.io/downloads/version.json

# Keep this workflow free of external `uses:` actions. During a GitHub Actions
# incident the runner may be healthy while the action-download service is not;
# direct commands let test and release continue without actions/checkout,
# setup-flutter, setup-java, or a release action.
jobs:
  test-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout commit
        env:
          REPOSITORY_TOKEN: ${{ github.token }}
        run: |
          git init .
          git remote add origin "https://x-access-token:${REPOSITORY_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Install Flutter stable
        run: |
          git clone --depth=1 --branch=stable https://github.com/flutter/flutter.git "${RUNNER_TEMP}/flutter"
          echo "${RUNNER_TEMP}/flutter/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/flutter/bin/flutter" config --no-analytics
          "${RUNNER_TEMP}/flutter/bin/flutter" precache --android

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Compute release version
        id: version
        run: |
          BASE=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          BUILD=${{ github.run_number }}
          echo "name=${BASE}" >> "${GITHUB_OUTPUT}"
          echo "build=${BUILD}" >> "${GITHUB_OUTPUT}"
          echo "full=${BASE}+${BUILD}" >> "${GITHUB_OUTPUT}"

      - name: Verify Java and Android toolchain
        run: |
          java -version
          flutter doctor -v

      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > android/app/release.keystore
            cat > android/key.properties <<EOF
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=release.keystore
          EOF
            echo "Release keystore SHA-1 (add to Google Cloud Android OAuth client):"
            keytool -list -v -keystore android/app/release.keystore -alias "${ANDROID_KEY_ALIAS}" -storepass "${ANDROID_KEYSTORE_PASSWORD}" | grep "SHA1:"
          fi

      - name: Build release APK
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.GOOGLE_ANDROID_CLIENT_ID }}
          GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
        run: |
          flutter build apk --release \
            --build-name="${{ steps.version.outputs.name }}" \
            --build-number="${{ steps.version.outputs.build }}" \
            --dart-define=API_BASE_URL=https://api.miramind.io \
            --dart-define=GOOGLE_WEB_CLIENT_ID="${GOOGLE_WEB_CLIENT_ID}" \
            --dart-define=GOOGLE_ANDROID_CLIENT_ID="${GOOGLE_ANDROID_CLIENT_ID}" \
            --dart-define=GOOGLE_IOS_CLIENT_ID="${GOOGLE_IOS_CLIENT_ID}"

      - name: Create version manifest
        run: |
          cat > version.json <<EOF
          {
            "versionName": "${{ steps.version.outputs.name }}",
            "buildNumber": ${{ steps.version.outputs.build }},
            "minBuildNumber": 1,
            "downloadUrl": "${MOBILE_APK_URL}",
            "optional": true
          }
          EOF

      - name: Upload APK to miramind.io
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_KEY}" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          export DEPLOY_SSH_KEY_FILE=~/.ssh/deploy_key
          bash scripts/deploy-mobile-apk.sh \
            build/app/outputs/flutter-apk/app-release.apk \
            version.json

      - name: Verify public manifest
        run: |
          curl -sf "${MOBILE_MANIFEST_URL}" | tee /tmp/version.json
          grep -q '"downloadUrl".*miramind.io/downloads/mira-latest.apk' /tmp/version.json

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.full }}" \
            build/app/outputs/flutter-apk/app-release.apk \
            version.json \
            --title "Mira ${{ steps.version.outputs.full }}" \
            --notes "Automated Android release for commit ${GITHUB_SHA}.\n\nProduction download: ${MOBILE_APK_URL}"
